<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Town - Strategy Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏘️ Pixel Town</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">💰 Gold:</span>
                    <span class="value" id="goldCount">100</span>
                </div>
                <div class="stat">
                    <span class="label">👥 Population:</span>
                    <span class="value" id="populationCount">10</span>
                </div>
                <div class="stat">
                    <span class="label">🌾 Food:</span>
                    <span class="value" id="foodCount">50</span>
                </div>
                <div class="stat">
                    <span class="label">⏱️ Day:</span>
                    <span class="value" id="dayCount">1</span>
                </div>
            </div>
        </div>

        <div class="game-wrapper">
            <div class="game-area">
                <canvas id="gameCanvas" width="800" height="600"></canvas>
            </div>

            <div class="sidebar">
                <div class="section">
                    <h3>Buildings</h3>
                    <div class="building-buttons">
                        <button class="building-btn" data-building="house" data-cost="30">
                            🏠 House<br><small>Cost: 30</small>
                        </button>
                        <button class="building-btn" data-building="farm" data-cost="40">
                            🌾 Farm<br><small>Cost: 40</small>
                        </button>
                        <button class="building-btn" data-building="market" data-cost="60">
                            🏪 Market<br><small>Cost: 60</small>
                        </button>
                        <button class="building-btn" data-building="mine" data-cost="80">
                            ⛏️ Mine<br><small>Cost: 80</small>
                        </button>
                        <button class="building-btn" data-building="barracks" data-cost="100">
                            🏰 Barracks<br><small>Cost: 100</small>
                        </button>
                    </div>
                </div>

                <div class="section">
                    <h3>Actions</h3>
                    <button class="action-btn" id="nextDayBtn">➡️ Next Day</button>
                    <button class="action-btn" id="resetBtn">🔄 Reset Game</button>
                </div>

                <div class="section">
                    <h3>Info</h3>
                    <p class="info-text">Click on the map to place buildings. Each building generates resources over time.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
    <script src="town.js"></script>
    <script src="ui.js"></script>
</body>
</html>
